<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İDM Mühendislik | Sanayi ve Ticaret Ltd. Şti.</title>

    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* Ana Renkler ve Hero */
        .navy-blue { color: #081234; }
        .bg-navy { background-color: #081234; }
        .hero-gradient { background: linear-gradient(rgba(8, 18, 52, 0.7), rgba(8, 18, 52, 0.7)); }
        
        /* Bıçak Özellikleri Tablo Stilleri */
        .spec-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; font-size: 0.85rem; }
        .spec-label { color: #64748b; font-weight: 600; min-width: 130px; }
        .spec-value { color: #1e293b; font-weight: 500; text-align: right; }
        
        /* Referans Slider Animasyonu */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .slider { background: white; height: 80px; margin: auto; overflow: hidden; position: relative; width: 100%; }
        .slide-track { animation: scroll 20s linear infinite; display: flex; width: max-content; }
        .slide { height: 80px; width: 200px; display: flex; align-items: center; justify-content: center; padding: 0 20px; }
        .slide img { max-height: 50px; max-width: 150px; width: auto; height: auto; filter: grayscale(100%); opacity: 0.85; transition: all 0.5s ease; }
        .slide img:hover { filter: grayscale(0%); opacity: 1; transform: scale(1.1); }

        /* Neden Biz (Feature Card) Stilleri */
        .feature-card {
            padding: 2rem; background: white; border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08);
            border-top: 4px solid #1d4ed8; display: flex; flex-direction: column;
            align-items: center; text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease, border-color 0.3s ease;
            cursor: default;
        }
        .feature-card:hover {
            transform: translateY(-10px); box-shadow: 0 25px 50px -10px rgba(8,18,52,0.2);
            background: #081234; border-color: #3b82f6;
        }
        .feature-card:hover .card-icon { color: #60a5fa; }
        .feature-card:hover .card-title { color: white; }
        .feature-card:hover .card-text { color: #94a3b8; }

        /* Lightbox Stilleri */
